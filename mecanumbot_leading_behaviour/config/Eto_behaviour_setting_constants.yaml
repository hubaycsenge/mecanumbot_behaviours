bottom_up_tree_node:
  ros__parameters:
    init_delay: 1.5
    # Minimum approach distance, measured from base_link to the *detected
    # person centre*. The footprint reaches 0.2875 m ahead of base_link, so the
    # bumper stops 0.46 m short of that point and roughly 0.25 m clear of the
    # person themselves. Anything under about 0.5 m here means contact.
    robot_closeness_threshold: 0.75
    target_reached_threshold: 1.5  # the critical distance of target and subject to tell if reached TODO: test optimum

    visibility_time_threshold: 2 # time threshold of last incoming 'subject' data
    robot_approach_distance : 1.0 #how much the robot should go at once in dog condition TODO: test optimum
    Dog_following_max_threshold: 2.0 # maximum distance difference allowed from the robot to still consider following 
    Dog_max_wander_allowed: 2 # maximum allowed wander count before considering the subject lost

    # ======================================================================
    # Tunables. Every key below used to be a constructor default or a module
    # constant in the behaviour library; the values here are those numbers.
    # They are optional -- a file that omits one keeps the packaged default in
    # `behaviours/constants.py` -- but the shipped files declare all of them so
    # that a run is described by one file.
    #
    # These are the same values as in behaviour_setting_constants.yaml. What
    # differs between the two rooms is the route and the distances above, not
    # how the robot turns or how long it waits; a tunable that does turn out to
    # be room-dependent belongs here with a note saying so, the way the
    # ostensive files mark theirs.
    #
    # Angles are in degrees and reach the blackboard in radians, under the same
    # name without the `_deg` suffix.
    # ======================================================================

    # ----- Tree runtime ---------------------------------------------------
    tick_period_ms: 100.0
    setup_timeout: 15.0

    # ----- Seeing people --------------------------------------------------
    sight_timeout: 1.0

    # ----- Rotation profile -----------------------------------------------
    turn_max_speed: 0.6
    turn_accel: 0.8
    turn_decel_gain: 1.6
    turn_min_speed: 0.12
    turn_tolerance_deg: 3.0
    facing_epsilon_deg: 1.5

    # ----- Turning behaviours ---------------------------------------------
    turn_timeout: 20.0
    turn_nav2_wait: 2.0
    turn_target_timeout: 3.0
    turn_corrections: 1
    attention_turn_step_deg: 15.0

    # ----- Scanning for people --------------------------------------------
    scan_spin_speed: 0.5
    scan_timeout: 10.0
    full_scan_spin_speed: 0.3
    full_scan_timeout: 45.0
    full_scan_revolutions: 1.0

    # ----- Looking back while leading (dog condition) ----------------------
    # The check-in turn onto the human's last known place, slower than either
    # scan above so that it reads as looking and the detector has time to find
    # somebody the robot sweeps past.
    glance_spin_speed: 0.4
    glance_timeout: 20.0
    glance_sweep_deg: 25.0
    # A look back every so many checkpoints and every so many seconds,
    # whichever falls due first, plus straight away when the human goes out of
    # sight or drops further than Dog_following_max_threshold.
    check_in_every_checkpoints: 2
    check_in_interval: 20.0
    check_in_grace: 2.0
    check_in_catch_up_timeout: 6.0

    # ----- Approaching with nav2 -------------------------------------------
    approach_target_timeout: 3.0
    approach_goal_timeout: 10.0
    route_step_distance: 1.0
    # How far short of a place on the route a goal stops -- the route's own
    # equivalent of robot_closeness_threshold above, kept separate so that
    # letting the robot keep its distance from a person does not also move
    # where it parks at a checkpoint.
    route_stop_distance: 0.5
    # How many route checkpoints one NavigateThroughPoses goal may cover, how
    # close counts as having driven past one, and the smallest bend worth
    # turning on the spot for before setting off.
    route_lookahead: 3
    checkpoint_reached_distance: 0.5
    route_turn_min_deg: 30.0
    nav_goal_retries: 3

    # ----- Getting the human back ------------------------------------------
    resume_passed_margin: 0.15
    recover_retries: 3

    # ----- Pacing of the signalling ----------------------------------------
    thank_delay: 1.0
    show_turn_delay: 2.0

    # ----- Accessory poses --------------------------------------------------
    neck_seek_pos: 7.0
    neck_level_pos: 6.0
    gripper_left_neutral: 6.83
    gripper_right_neutral: 3.36

    Dog_checkpoints:
     #- "{'X':0.687003, 'Y':3.54149, 'Z':0.0 }" # too close to wall :/
     - "{'X':1.35244, 'Y':4.01954, 'Z':0.0 }"
     - "{'X':-3.06462, 'Y':5.40894, 'Z':0.0 }"
     - "{'X':-4.28269, 'Y':1.40561, 'Z':0.0 }"
     - "{'X':-0.033288, 'Y':-0.398331, 'Z':0.0 }"
     - "{'X':0.417255, 'Y':-0.539768, 'Z':0.0 }"
      # Régi
