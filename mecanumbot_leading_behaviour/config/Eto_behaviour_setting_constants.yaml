# Leading-behaviour constants.
#
# Loaded by ConstantParamsToBlackboard (blackboard_managers.py) with a plain
# yaml.safe_load, which descends bottom_up_tree_node -> ros__parameters and
# then runs ast.literal_eval over every quoted entry below. Those entries are
# Python dict literals stored as YAML strings and MUST stay quoted -- turning
# one into a real YAML mapping breaks the tree at setup().
#
# Changes take effect the next time a behaviour tree starts, not live.
#
# LED  mode:  1 wave right, 2 wave left, 3 pulse, 4 solid,
#             5 fast blink, 6 slow blink
# LED  color: 0 black, 1 white, 2 green, 3 red,
#             4 blue,  5 cyan,  6 pink,  7 yellow
# Pose n_pos: neck tilt 2.0 .. 8.6   gl_pos/gr_pos: 1.6 .. 8.54
#
# Each *_times list supplies one delay per *_seq pattern. It may be longer
# (surplus entries are ignored) but never shorter.

bottom_up_tree_node:
  ros__parameters:
    init_delay:                  0.5      # Delay before the tree starts acting [s]
    robot_closeness_threshold:   1.25     # Minimum approach distance; below this the robot risks hitting the subject [m]
    robot_approach_distance:     1.0      # How far the robot advances in one step [m]
    target_reached_threshold:    1.5      # Distance between target and subject that counts as arrived [m]
    visibility_time_threshold:   2.0      # Age of the last subject fix before it is stale [s]
    Dog_following_max_threshold: 2.0      # Largest distance difference that still counts as following [m]
    Dog_max_wander_allowed:      2        # Wander events tolerated before the subject is considered lost [count]

    # ======================================================================
    # Tunables. Every key below used to be a constructor default or a module
    # constant in the behaviour library. A file that omits one keeps the
    # packaged default in `behaviours/constants.py`.
    #
    # Angles are in degrees and reach the blackboard in radians, under the
    # same name without the `_deg` suffix.
    # ======================================================================

    # ----- Tree runtime --------------------------------------------------------
    tick_period_ms: 100.0
    setup_timeout: 15.0

    # ----- Seeing people -------------------------------------------------------
    sight_timeout: 3.0

    # ----- Rotation profile ----------------------------------------------------
    turn_max_speed: 0.6
    turn_accel: 0.8
    turn_decel_gain: 1.6
    turn_min_speed: 0.12
    turn_tolerance_deg: 3.0
    facing_epsilon_deg: 1.5

    # ----- Turning behaviours --------------------------------------------------
    turn_timeout: 20.0
    turn_nav2_wait: 2.0
    turn_target_timeout: 3.0
    turn_corrections: 1
    attention_turn_step_deg: 15.0

    # ----- Scanning for people -------------------------------------------------
    scan_spin_speed: 0.5
    scan_timeout: 10.0
    full_scan_spin_speed: 0.3
    full_scan_timeout: 45.0
    full_scan_revolutions: 1.0

    # ----- Looking back while leading (dog condition) --------------------------
    # The check-in turn, set off towards the human's last known place and run
    # slower than either scan above so that it reads as looking and the
    # detector has time to find somebody the robot sweeps past. It carries on
    # for a whole revolution unless a detection stops it first.
    glance_spin_speed: 0.4
    glance_timeout: 30.0
    glance_revolutions: 1.0
    # A look back every so many checkpoints and every so many seconds,
    # whichever falls due first, plus straight away when the human goes out of
    # sight or drops further than Dog_following_max_threshold.
    check_in_every_checkpoints: 2
    check_in_interval: 20.0
    check_in_grace: 2.0
    check_in_catch_up_timeout: 6.0

    # ----- Approaching with nav2 -----------------------------------------------
    approach_target_timeout: 3.0
    approach_goal_timeout: 10.0
    route_step_distance: 1.0
    # How far short of a place on the route a goal stops -- the route's own
    # equivalent of robot_closeness_threshold above, kept separate so that
    # letting the robot keep its distance from a person does not also move
    # where it parks at a checkpoint.
    route_stop_distance: 0.5
    # How many route checkpoints one NavigateThroughPoses goal may cover, how
    # close counts as having driven past one, and the smallest bend worth
    # turning on the spot for before setting off.
    route_lookahead: 3
    checkpoint_reached_distance: 0.5
    route_turn_min_deg: 30.0
    nav_goal_retries: 3

    # ----- Getting the human back ----------------------------------------------
    resume_passed_margin: 0.15
    recover_retries: 3

    # ----- Pacing of the signalling --------------------------------------------
    thank_delay: 1.0
    show_turn_delay: 2.0

    # ----- Accessory poses -----------------------------------------------------
    neck_seek_pos: 6.5
    neck_level_pos: 6.5
    gripper_left_neutral: 6.83
    gripper_right_neutral: 3.36
    # A face at the bottom of the camera frame while searching tilts the head
    # down by look_down_step (n_pos; 0.5 is ~15 deg) for look_down_hold s, then
    # back up; the cue is then ignored for look_down_cooldown s.
    look_down_step: 0.5
    look_down_hold: 3.0
    look_down_cooldown: 4.0
    look_down_cue_age: 0.5

    # ----- The head following the body the LiDAR expects (dog + LED conditions) -
    # While the head is lifted to look for or at the human it is not held at
    # neck_seek_pos but tilted to whichever height shows the body the LiDAR
    # says should be there: nearer means further up, and a body on one of the
    # seats below is looked for at sitting height. neck_seek_pos is where it
    # rests with nothing in view. The dog-inspired tree does this whenever its
    # head is lifted, the LED tree only while it looks for the person (it parks
    # the head at neck_level_pos to lead and to signal), and the control tree
    # never. false here switches it off in both, and the head goes back to one
    # fixed seeking pose.
    body_gaze_enabled: true
    body_gaze_period: 0.2            # seconds between two looks at what is in view
    body_gaze_max_range: 4.5         # bodies further off than this are not tilted for [m]
    body_gaze_view_margin_deg: 12.0  # attended to this far beyond the edge of the picture
    body_gaze_frame_margin_deg: 3.0  # kept clear above and below a body in the frame
    body_gaze_min_pos: 5.5           # the neck positions the gaze may command
    body_gaze_max_pos: 8.2
    body_gaze_deadband: 0.1          # smallest change worth a command (0.1 is ~3 deg)
    body_gaze_min_interval: 0.4      # shortest time between two commands [s]
    body_gaze_release_delay: 1.0     # nothing in view this long -> back to neck_seek_pos [s]
    body_gaze_candidate_timeout: 0.5 # how old the LiDAR's candidate list may be [s]
    # The band of heights the pose detector needs of each kind of body, from
    # the hips to the top of the head [m]. A kind left out keeps the packaged
    # band; `standing` is anybody not on a seat.
    body_profiles:
      - "{'body':'standing', 'low':0.85, 'high':1.80}"
      - "{'body':'chair',    'low':0.40, 'high':1.30}"
      - "{'body':'bean_bag', 'low':0.10, 'high':0.75}"
    # Known places in THIS map where a body is lower than a standing one. Both
    # were read off the bags of 2026-09-30 in mecanumbot_directories/bag_debug
    # and should be checked against the room before a trial:
    #   bean bag -- the person the robot turned past for a minute and a half in
    #     the 08:46 run sat here; the LiDAR had them at (-0.60, 2.33) and their
    #     shoulders came out at ~0.4 m. The map has a bean-bag-sized ring half
    #     a metre away at (-1.0, 2.0), so it has moved since it was mapped and
    #     the radius is wide enough to cover both places.
    #   chair -- the person sitting against the east wall in the 09:02 run
    #     (shoulders ~0.95 m), whose legs the LiDAR saw at about (1.15, 3.35),
    #     0.3 m in front of the wall.
    # x, y are map coordinates in lower case: 'X'/'Y' would be read as a route
    # checkpoint. radius is how far from the point still counts as on the seat.
    # 'low' and 'high' on an entry override its body profile.
    seats:
      - "{'seat':'bean_bag', 'x':-0.80, 'y':2.20, 'radius':0.70}"
      - "{'seat':'chair',    'x':1.15,  'y':3.35, 'radius':0.60}"

    # Route. [0] is the start position, [-1] is the target.
    Dog_checkpoints:
      - "{'X':1.35244, 'Y':4.01954, 'Z':0.0}"  # start
      - "{'X':-3.06462, 'Y':5.40894, 'Z':0.0}"  # waypoint 1
      - "{'X':-4.28269, 'Y':1.40561, 'Z':0.0}"  # waypoint 2
      - "{'X':-0.033288, 'Y':-0.398331, 'Z':0.0}"  # waypoint 3
      - "{'X':0.417255, 'Y':-0.539768, 'Z':0.0}"  # target

    LED_start_setting:
      - "{'fl':{'mode':4, 'color':0},'fr':{'mode':4, 'color':0},'bl':{'mode':4, 'color':0},'br':{'mode':4, 'color':0}}"  # black solid

    # What the lights show while the robot drives to the target. They never go
    # dark on the way: the light flows, and the panels fill with
    # LED_lead_progress_color, one LED per eighth of the way driven (the fill
    # needs the Nano firmware that draws it; older firmware shows the flow only).
    #
    # The four strips cut the corners of the top plate, so a wave can run from
    # the rear tip round both sides to the front tip. "straight" is that:
    # wave right on fl and br, wave left on fr and bl. "left" and "right" send
    # all four the same way, towards the side the destination lies on.
    LED_lead_straight:
      - "{'fl':{'mode':1, 'color':1},'fr':{'mode':2, 'color':1},'bl':{'mode':2, 'color':1},'br':{'mode':1, 'color':1}}"  # white, flowing ahead
    LED_lead_left:
      - "{'fl':{'mode':2, 'color':1},'fr':{'mode':2, 'color':1},'bl':{'mode':2, 'color':1},'br':{'mode':2, 'color':1}}"  # white wave left
    LED_lead_right:
      - "{'fl':{'mode':1, 'color':1},'fr':{'mode':1, 'color':1},'bl':{'mode':1, 'color':1},'br':{'mode':1, 'color':1}}"  # white wave right
    LED_lead_progress_color:     2        # Colour the panels fill with as the drive progresses (green)
    LED_lead_direction:          target   # target: flow towards the destination's side when it is off the heading | none: always ahead
    LED_lead_straight_band_deg:  30.0     # Destination within this of the heading counts as ahead [deg]
    LED_address_person:          true     # Attention and thanks light only the half of the robot facing the person

    LED_indicate_target_seq:
      - "{'fl':{'mode':4, 'color':0},'fr':{'mode':4, 'color':0},'bl':{'mode':4, 'color':0},'br':{'mode':4, 'color':0}}"  # black solid
      - "{'fl':{'mode':3, 'color':2},'fr':{'mode':3, 'color':2},'bl':{'mode':3, 'color':2},'br':{'mode':3, 'color':2}}"  # green pulse
      - "{'fl':{'mode':4, 'color':0},'fr':{'mode':4, 'color':0},'bl':{'mode':4, 'color':0},'br':{'mode':4, 'color':0}}"  # black solid
      - "{'fl':{'mode':3, 'color':2},'fr':{'mode':3, 'color':2},'bl':{'mode':3, 'color':2},'br':{'mode':3, 'color':2}}"  # green pulse
      - "{'fl':{'mode':4, 'color':0},'fr':{'mode':4, 'color':0},'bl':{'mode':4, 'color':0},'br':{'mode':4, 'color':0}}"  # black solid
    LED_indicate_target_times:
      - 0.5  # black solid
      - 1.5  # green pulse
      - 0.5  # black solid
      - 1.5  # green pulse
      - 0.5  # black solid

    LED_indicate_close_target_seq:
      - "{'fl':{'mode':4, 'color':0},'fr':{'mode':4, 'color':0},'bl':{'mode':4, 'color':0},'br':{'mode':4, 'color':0}}"  # black solid
      - "{'fl':{'mode':5, 'color':2},'fr':{'mode':5, 'color':2},'bl':{'mode':5, 'color':2},'br':{'mode':5, 'color':2}}"  # green fast blink
      - "{'fl':{'mode':4, 'color':0},'fr':{'mode':4, 'color':0},'bl':{'mode':4, 'color':0},'br':{'mode':4, 'color':0}}"  # black solid
      - "{'fl':{'mode':5, 'color':2},'fr':{'mode':5, 'color':2},'bl':{'mode':5, 'color':2},'br':{'mode':5, 'color':2}}"  # green fast blink
      - "{'fl':{'mode':4, 'color':0},'fr':{'mode':4, 'color':0},'bl':{'mode':4, 'color':0},'br':{'mode':4, 'color':0}}"  # black solid
    LED_indicate_close_target_times:
      - 0.5  # black solid
      - 1.5  # green fast blink
      - 0.5  # black solid
      - 1.5  # green fast blink
      - 0.5  # black solid
      - 1.5  # (surplus, never read)
      - 0.5  # (surplus, never read)

    LED_catch_attention_seq:
      - "{'fl':{'mode':5, 'color':7},'fr':{'mode':5, 'color':7},'bl':{'mode':5, 'color':7},'br':{'mode':5, 'color':7}}"  # yellow fast blink
      - "{'fl':{'mode':4, 'color':0},'fr':{'mode':4, 'color':0},'bl':{'mode':4, 'color':0},'br':{'mode':4, 'color':0}}"  # black solid
      - "{'fl':{'mode':5, 'color':7},'fr':{'mode':5, 'color':7},'bl':{'mode':5, 'color':7},'br':{'mode':5, 'color':7}}"  # yellow fast blink
      - "{'fl':{'mode':1, 'color':0},'fr':{'mode':1, 'color':0},'bl':{'mode':1, 'color':0},'br':{'mode':1, 'color':0}}"  # black wave right
    LED_catch_attention_times:
      - 1.5  # yellow fast blink
      - 0.5  # black solid
      - 1.5  # yellow fast blink
      - 0.5  # black wave right

    LED_thank_seq:
      - "{'fl':{'mode':6, 'color':6},'fr':{'mode':6, 'color':6},'bl':{'mode':6, 'color':6},'br':{'mode':6, 'color':6}}"  # pink slow blink
      - "{'fl':{'mode':4, 'color':0},'fr':{'mode':4, 'color':0},'bl':{'mode':4, 'color':0},'br':{'mode':4, 'color':0}}"  # black solid
      - "{'fl':{'mode':6, 'color':6},'fr':{'mode':6, 'color':6},'bl':{'mode':6, 'color':6},'br':{'mode':6, 'color':6}}"  # pink slow blink
      - "{'fl':{'mode':1, 'color':0},'fr':{'mode':1, 'color':0},'bl':{'mode':1, 'color':0},'br':{'mode':1, 'color':0}}"  # black wave right
    LED_thank_times:
      - 1.5  # pink slow blink
      - 0.5  # black solid
      - 1.5  # pink slow blink
      - 0.5  # black wave right

    Dog_indicate_target_seq:
      - "{'n_pos':6.0,'gl_pos':3.19,'gr_pos':7.05}"  # gripper closed, look level
      - "{'n_pos':6.0,'gl_pos':7.05,'gr_pos':3.19}"  # gripper open, look level
      - "{'n_pos':6.0,'gl_pos':3.19,'gr_pos':7.05}"  # gripper closed, look level
      - "{'n_pos':6.0,'gl_pos':7.05,'gr_pos':3.19}"  # gripper open, look level
      - "{'n_pos':6.0,'gl_pos':3.19,'gr_pos':7.05}"  # gripper closed, look level
      - "{'n_pos':6.0,'gl_pos':7.05,'gr_pos':3.19}"  # gripper open, look level
      - "{'n_pos':6.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
    Dog_indicate_target_times:
      - 0.5  # gripper closed, look level
      - 0.5  # gripper open, look level
      - 0.5  # gripper closed, look level
      - 0.5  # gripper open, look level
      - 0.5  # gripper closed, look level
      - 0.5  # gripper open, look level
      - 0.5  # gripper open, look level
      - 0.5  # (surplus, never read)

    Dog_catch_attention_seq:
      - "{'n_pos':6.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
      - "{'n_pos':7.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
      - "{'n_pos':6.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
      - "{'n_pos':7.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
      - "{'n_pos':6.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
      - "{'n_pos':7.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
    Dog_catch_attention_times:
      - 0.25  # gripper open, look level
      - 0.25  # gripper open, look level
      - 0.25  # gripper open, look level
      - 0.25  # gripper open, look level
      - 0.25  # gripper open, look level
      - 0.25  # gripper open, look level

    Dog_thank_seq:
      - "{'n_pos':6.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
      - "{'n_pos':7.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
      - "{'n_pos':6.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
      - "{'n_pos':7.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
      - "{'n_pos':6.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
      - "{'n_pos':7.0,'gl_pos':6.83,'gr_pos':3.36}"  # gripper open, look level
    Dog_thank_times:
      - 0.25  # gripper open, look level
      - 0.25  # gripper open, look level
      - 0.25  # gripper open, look level
      - 0.25  # gripper open, look level
      - 0.25  # gripper open, look level
      - 0.25  # gripper open, look level
